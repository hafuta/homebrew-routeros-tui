name: Bump formula

on:
  workflow_dispatch:
  repository_dispatch:
    types: [mikrotik-tui-release]
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update formula from latest release
        run: python3 scripts/bump_formula.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mikrotik-tui.rb
          if git diff --staged --quiet; then
            echo "formula already current"
            exit 0
          fi
          git commit -m "chore: bump mikrotik-tui formula to latest release"
          git push
